<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日更新 · 热剧资源</title>
<meta name="description" content="每日更新热播剧集，百度网盘+夸克网盘资源分享">
<style>
  :root {
    --accent: #e84a6b;
    --accent-light: #fff0f3;
    --bg: #fafafa;
    --card: #fff;
    --text: #333;
    --text-secondary: #888;
    --border: #eee;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* Header */
  .header {
    text-align: center; padding: 20px 0 10px;
  }
  .header .icon {
    width: 48px; height: 48px; background: linear-gradient(135deg, #e84a6b, #ff7b9b);
    border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; margin-bottom: 8px;
    box-shadow: 0 4px 12px rgba(232,74,107,0.3);
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }

  /* Stats */
  .stats {
    display: flex; justify-content: center; gap: 20px; margin: 8px 0 16px;
    font-size: 13px; color: var(--text-secondary);
  }
  .stats strong { color: var(--accent); }

  /* Search */
  .search-box {
    position: relative; margin-bottom: 16px;
  }
  .search-box input {
    width: 100%; padding: 12px 16px 12px 42px; border: 1px solid var(--border);
    border-radius: 24px; font-size: 15px; font-family: inherit;
    background: var(--card); box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s; outline: none;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,74,107,0.1);
  }
  .search-box .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #bbb; font-size: 17px; pointer-events: none;
  }
  .search-box .clear-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: #ddd; color: #fff; border: none; width: 22px; height: 22px;
    border-radius: 50%; font-size: 13px; cursor: pointer; display: none;
    align-items: center; justify-content: center; line-height: 1;
  }
  .search-box .clear-btn.show { display: flex; }

  /* Section title */
  .section-title {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    font-size: 15px; font-weight: 600;
  }
  .section-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .section-title .count { font-weight: 400; color: var(--text-secondary); font-size: 13px; }

  /* Show card */
  .show-card {
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 10px; box-shadow: var(--shadow);
    border-left: 3px solid transparent; transition: border-color .2s;
    position: relative;
  }
  .show-card.updated { border-left-color: var(--accent); background: var(--accent-light); }

  .show-card .top-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .show-card .title { font-size: 16px; font-weight: 600; }
  .show-card .meta {
    font-size: 12px; color: var(--text-secondary);
    background: #f0f0f0; padding: 2px 8px; border-radius: 10px;
  }
  .show-card .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }
  .badge-new { background: #ffe0e5; color: #e84a6b; }
  .badge-today { background: #fff0e0; color: #e8843c; }
  .badge-pinned { background: #fff7e6; color: #fa8c16; }
  .badge-completed { background: #e6ffe6; color: #52c41a; }

  .section-header {
    font-size: 14px; font-weight: 600; color: #555;
    padding: 8px 0 6px; margin-top: 4px;
  }
  .section-header:first-child { margin-top: 0; }

  .show-card .links { display: flex; flex-direction: column; gap: 4px; }
  .show-card .link-row {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    padding: 6px 10px; background: #f8f8f8; border-radius: 8px;
    text-decoration: none; color: var(--text); transition: background .15s;
  }
  .show-card .link-row:hover { background: #f0f0f0; }
  .show-card .link-row .platform {
    font-weight: 600; font-size: 12px; min-width: 36px; flex-shrink: 0;
  }
  .platform.bd { color: #4a90d9; }
  .platform.kk { color: #d94a4a; }
  .show-card .link-url {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-secondary); font-size: 12px;
  }
  .show-card .copy-link {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 14px; padding: 4px; flex-shrink: 0;
    transition: color .15s;
  }
  .show-card .copy-link:hover { color: var(--accent); }

  .copy-link-btn {
    font-size: 12px; background: none; border: 1px solid #ddd; border-radius: 14px;
    padding: 4px 10px; cursor: pointer; color: #888; flex-shrink: 0;
    transition: all .15s;
  }
  .copy-link-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Empty state */
  .empty {
    text-align: center; padding: 40px 20px; color: #ccc;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* Footer */
  .footer {
    text-align: center; padding: 24px 16px; font-size: 12px; color: #ccc;
    line-height: 1.8;
  }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
    font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* No results */
  .no-results {
    text-align: center; padding: 30px; color: #bbb; font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .show-card { padding: 12px; }
    .show-card .title { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="icon">🎬</div>
    <h1>每日更新</h1>
  </div>

  <!-- Stats -->
  <div class="stats">
    <span>共 <strong id="totalCount">0</strong> 部</span>
    <span>今日更新 <strong id="todayCount">0</strong> 部</span>
  </div>

  <!-- Search -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索剧名..." autocomplete="off">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>

  <!-- Shows -->
  <div class="section-title" id="sectionTitle">
    <span class="dot"></span> 全部剧集 <span class="count" id="showCount"></span>
  </div>
  <div id="showList"></div>

  <!-- Footer -->
  <div class="footer">
    所有资源均来自互联网公开引用，未提供上传存储服务
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
  const TODAY = new Date().toLocaleDateString('zh-CN');
  let shows = window.__SHOWS__ || [];

  function sortShows(list) {
    return [...list].sort((a, b) => {
      // pinned first
      if (a.isPinned && !b.isPinned) return -1;
      if (!a.isPinned && b.isPinned) return 1;
      // today's updates after pinned
      const aToday = a.updatedDate === TODAY ? 1 : 0;
      const bToday = b.updatedDate === TODAY ? 1 : 0;
      if (aToday !== bToday) return bToday - aToday;
      // ongoing before completed
      if (a.isCompleted && !b.isCompleted) return 1;
      if (!a.isCompleted && b.isCompleted) return -1;
      return a.title.localeCompare(b.title, 'zh');
    });
  }

  function render(filter = '') {
    const q = filter.trim().toLowerCase();
    let filtered = q ? shows.filter(s => s.title.toLowerCase().includes(q)) : [...shows];
    filtered = sortShows(filtered);

    const listEl = document.getElementById('showList');
    document.getElementById('totalCount').textContent = shows.length;
    document.getElementById('todayCount').textContent = shows.filter(s => s.updatedDate === TODAY).length;

    const countLabel = q ? `搜索"${esc(q)}"找到 ${filtered.length} 部` : `${shows.length} 部`;
    document.getElementById('showCount').textContent = countLabel;

    if (filtered.length === 0) {
      document.getElementById('sectionTitle').style.display = 'none';
      listEl.innerHTML = q
        ? '<div class="no-results">未找到包含「' + esc(q) + '」的剧集</div>'
        : '<div class="empty"><div class="icon">📭</div>暂无剧集</div>';
      return;
    }

    document.getElementById('sectionTitle').style.display = 'flex';

    // group into sections
    const pinned = filtered.filter(s => s.isPinned);
    const todayNotPinned = filtered.filter(s => !s.isPinned && s.updatedDate === TODAY);
    const ongoing = filtered.filter(s => !s.isPinned && s.updatedDate !== TODAY && !s.isCompleted);
    const completed = filtered.filter(s => !s.isPinned && s.isCompleted);

    const sections = [];
    if (pinned.length) sections.push({ title: '📌 置顶推荐', shows: pinned });
    if (todayNotPinned.length) sections.push({ title: '🔥 今日更新', shows: todayNotPinned });
    if (ongoing.length) sections.push({ title: '📺 连载中', shows: ongoing });
    if (completed.length) sections.push({ title: '✅ 完结专区', shows: completed });

    listEl.innerHTML = sections.map(sec => {
      const cards = sec.shows.map(s => buildCard(s)).join('');
      return `<div class="section-header">${sec.title} <span style="font-weight:400;font-size:12px;color:#999">${sec.shows.length} 部</span></div>${cards}`;
    }).join('');

    // toggle clear button
    const clearBtn = document.getElementById('clearBtn');
    if (q) { clearBtn.classList.add('show'); }
    else { clearBtn.classList.remove('show'); }
  }

  function buildCard(s) {
    const isToday = s.updatedDate === TODAY;
    const badges = [];
    if (s.isPinned) badges.push('<span class="badge badge-pinned">置顶</span>');
    if (s.isCompleted) badges.push('<span class="badge badge-completed">完结</span>');
    if (s.isNew) badges.push('<span class="badge badge-new">新</span>');
    if (isToday) badges.push('<span class="badge badge-today">今日更新</span>');

    const epText = s.episode ? '更 ' + s.episode : '';

    let linksHTML = '';
    if (s.bdLink) {
      linksHTML += `
        <a class="link-row" href="${escAttr(s.bdLink)}" target="_blank" rel="noopener">
          <span class="platform bd">百度</span>
          <span class="link-url">${esc(s.bdLink)}</span>
          ${s.bdCode ? '<span style="font-size:11px;color:#888;flex-shrink:0">码:' + esc(s.bdCode) + '</span>' : ''}
          <button class="copy-link-btn" onclick="event.preventDefault();event.stopPropagation();copySingle('${escAttr(s.bdLink)}')">复制</button>
        </a>`;
    }
    if (s.kkLink) {
      linksHTML += `
        <a class="link-row" href="${escAttr(s.kkLink)}" target="_blank" rel="noopener">
          <span class="platform kk">夸克</span>
          <span class="link-url">${esc(s.kkLink)}</span>
          <button class="copy-link-btn" onclick="event.preventDefault();event.stopPropagation();copySingle('${escAttr(s.kkLink)}')">复制</button>
        </a>`;
    }

    const updatedClass = isToday ? ' updated' : '';

    return `<div class="show-card${updatedClass}">
      <div class="top-row">
        <span class="title">${esc(s.title)}</span>
        <span class="meta">${esc(s.quality)}${epText ? ' ' + epText : ''}</span>
        ${badges.join('')}
      </div>
      <div class="links">${linksHTML}</div>
    </div>`;
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    render();
    document.getElementById('searchInput').focus();
  }

  function copySingle(url) {
    navigator.clipboard.writeText(url).then(() => toast('链接已复制')).catch(() => toast('复制失败，请长按链接手动复制'));
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'<').replace(/>/g,'>'); }
  function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'<').replace(/>/g,'>'); }

  // search input
  document.getElementById('searchInput').addEventListener('input', function() {
    render(this.value);
  });

  // initial render
  render();
</script>

</body>
</html>
